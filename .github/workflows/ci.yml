name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 编译检查（语法 + 导入）
        run: |
          python -m compileall -q baidu_map.py config.py cost_matrix.py main.py models.py solver.py
          python -c "import main"
        env:
          BAIDU_MAP_AK: dummy-ak-for-import-check

      - name: 单元测试
        run: python -m pytest -q
        env:
          BAIDU_MAP_AK: dummy-ak-for-import-check

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + 构建
        run: npm run build
